# Déploiement en un clic sur Render (offre gratuite, WebSocket supportés).
# https://render.com/deploy?repo=https://github.com/dimitriborras/Dim
services:
  - type: web
    name: plastic-panic
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
